services:
  # ==============================================================================
  # 1. Cơ sở dữ liệu MySQL 8.0 (Tự động khởi tạo và nạp dữ liệu từ dump)
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: soc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: "soc_edr_db"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - soc-network

  # ==============================================================================
  # 2. Redis Server (Cache trạng thái Agent và Message Queue)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: soc-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - soc-network

  # ==============================================================================
  # 3. SOC/EDR Backend Server (Python FastAPI + gRPC)
  # ==============================================================================
  soc-server:
    build:
      context: ./soc-server-python
      dockerfile: Dockerfile
    container_name: soc-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Tương thích với .env của FastAPI
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "1"
      DB_NAME: "soc_edr_db"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      HOST: "0.0.0.0"
      PORT: "8080"
      GRPC_PORT: "50051"
      JWT_SECRET_KEY: "soc-agent-secret-token-2026"
      AGENT_SECRET_KEY: "soc-agent-secret-token-2026"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    ports:
      - "8080:8080"     # REST API & WebSocket
      - "50051:50051"   # gRPC cho Agents kết nối vào
    networks:
      - soc-network

  # ==============================================================================
  # 4. SOC Web Dashboard Frontend (React + Nginx)
  # ==============================================================================
  soc-frontend:
    build:
      context: ./soc-frontend
      dockerfile: Dockerfile
    container_name: soc-frontend
    restart: always
    depends_on:
      - soc-server
    ports:
      - "80:80"         # Truy cập Web Dashboard trực tiếp qua http://<IP_SERVER>
    networks:
      - soc-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  soc-network:
    driver: bridge
