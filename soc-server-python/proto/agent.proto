// ==============================================================================
// SOC/EDR All-in-One - Protocol Buffers Definition
// File: proto/agent.proto
// Mô tả: Định nghĩa gRPC Service cho giao tiếp Agent ↔ Server
//
// Service AgentService cung cấp 2 RPC:
//   1. StreamEvents - Bidirectional streaming: Agent gửi Sysmon/Event Log,
//      Server đẩy Active Response commands ngược lại.
//   2. Heartbeat - Unary RPC: Agent báo cáo trạng thái sống định kỳ.
// ==============================================================================

syntax = "proto3";

package agent;

option go_package = "soc-server/internal/generated/proto";

// ==============================================================================
// Enum: CommandType - Các loại lệnh Active Response Server → Agent
// ==============================================================================
enum CommandType {
  COMMAND_NONE     = 0; // Không có lệnh (giá trị mặc định)
  KILL_PROCESS     = 1; // Kết thúc tiến trình theo PID hoặc tên process
  BLOCK_IP         = 2; // Chặn IP address bằng Windows Firewall rule
  BLOCK_URL        = 3; // Chặn URL/Domain
  QUARANTINE_FILE  = 4; // Cách ly file nghi ngờ malware
  COLLECT_FORENSIC = 5; // Thu thập thêm thông tin forensic từ Endpoint
  ISOLATE_NETWORK  = 6; // Cô lập mạng Endpoint
}

// ==============================================================================
// Message: EventRequest - Agent gửi lên Server mỗi khi có Sysmon/Event Log mới
// ==============================================================================
message EventRequest {
  string agent_id    = 1; // ID duy nhất của Agent (UUID)
  string event_type  = 2; // Loại sự kiện: sysmon_process_create, ...
  string hostname    = 3; // Hostname của máy Endpoint
  string ip_address  = 4; // Địa chỉ IP của Endpoint
  string raw_payload = 5; // Dữ liệu log thô dưới dạng JSON string
  int64  timestamp   = 6; // Timestamp của sự kiện (Unix epoch ms)
  map<string, string> metadata = 7; // Thông tin bổ sung (key-value)
}

// ==============================================================================
// Message: CommandResponse - Server đẩy lệnh Active Response xuống Agent
// ==============================================================================
message CommandResponse {
  string      command_id   = 1; // ID duy nhất của lệnh (UUID)
  CommandType command_type = 2; // Loại lệnh cần thực thi
  string      target       = 3; // Đối tượng mục tiêu (PID, IP, file path...)
  map<string, string> parameters = 4; // Tham số bổ sung
  int64       timestamp    = 5; // Timestamp khi Server tạo lệnh
}

// ==============================================================================
// Message: HeartbeatRequest - Agent gửi định kỳ để báo cáo trạng thái
// ==============================================================================
message HeartbeatRequest {
  string agent_id      = 1; // ID duy nhất của Agent (UUID)
  string hostname      = 2; // Hostname của Endpoint
  string ip_address    = 3; // Địa chỉ IP hiện tại
  string os_type       = 4; // Hệ điều hành (windows, linux, macos)
  string agent_version = 5; // Phiên bản Agent đang chạy
  double cpu_usage     = 6; // Mức sử dụng CPU hiện tại (%)
  double memory_usage  = 7; // Mức sử dụng RAM hiện tại (%)
  int64  timestamp     = 8; // Timestamp gửi heartbeat
}

// ==============================================================================
// Message: HeartbeatResponse - Server phản hồi heartbeat
// ==============================================================================
message HeartbeatResponse {
  bool   acknowledged              = 1; // Server đã nhận heartbeat
  int32  heartbeat_interval_seconds = 2; // Khoảng thời gian gửi heartbeat tiếp theo
  string message                   = 3; // Thông báo từ Server (tuỳ chọn)
}

// ==============================================================================
// Service: AgentService - Giao tiếp 2 chiều giữa Agent và Server
// ==============================================================================
service AgentService {
  // StreamEvents: Kênh truyền 2 chiều (Bidirectional Streaming)
  // - Agent liên tục gửi Sysmon/Event Log lên Server (stream EventRequest)
  // - Server có thể đẩy lệnh Active Response xuống Agent bất kỳ lúc nào
  //   (stream CommandResponse) - ví dụ: KILL_PROCESS, BLOCK_IP
  rpc StreamEvents(stream EventRequest) returns (stream CommandResponse);

  // Heartbeat: Agent gửi tín hiệu "còn sống" định kỳ (mỗi 30 giây)
  // Server cập nhật trạng thái online/offline trong Redis + MySQL
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
