# ==============================================================================
# Cấu hình Server SOC/EDR All-in-One
# ==============================================================================

server:
  # Cổng cho REST API & WebSocket (Frontend kết nối vào đây)
  rest_port: 8080
  # Cổng cho gRPC Server (Agent kết nối vào đây qua mTLS)
  grpc_port: 50051

# ==============================================================================
# Cấu hình MySQL - Lưu trữ dữ liệu chính (Alerts, Cases, IOCs, Rules...)
# ==============================================================================
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "1"
  dbname: "soc_edr_db"
  sslmode: "disable"
  # Connection pool settings
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30

# ==============================================================================
# Cấu hình Redis - Cache trạng thái Agent & Message Queue
# ==============================================================================
redis:
  address: "localhost:6379"
  password: ""
  db: 0
  # TTL mặc định cho trạng thái agent (giây)
  agent_status_ttl_seconds: 60

# ==============================================================================
# Cấu hình mTLS - Chứng chỉ số cho gRPC Server
# Agents phải có Client Certificate ký bởi cùng CA mới kết nối được
# ==============================================================================
mtls:
  enabled: false
  ca_cert_path: "configs/certs/ca.crt"
  server_cert_path: "configs/certs/server.crt"
  server_key_path: "configs/certs/server.key"

# ==============================================================================
# Cấu hình Retention & Clean DB cho Alert
# ==============================================================================
alert:
  # Số ngày lưu trữ cho Alert mức độ LOW / EVENT-OBSERVED trước khi tự động xóa
  # Các Alert MEDIUM / HIGH / CRITICAL sẽ được giữ lại vĩnh viễn cho mục đích truy vết
  retention_days: 7

# ==============================================================================
# Cấu hình Detection Rules - Đường dẫn tới thư mục chứa file YAML rules
# ==============================================================================
rules:
  # Đường dẫn thư mục chứa các file .yaml định nghĩa Detection Rules
  yaml_dir: "configs/rules"
  # Có tải rules từ database hay không (ngoài YAML files)
  load_from_db: true

# ==============================================================================
# Cấu hình n8n SOAR Integration - Webhook 2 chiều
# ==============================================================================
soar:
  # URL webhook mặc định (fallback nếu URL riêng chưa cấu hình)
  n8n_webhook_url: "https://undegenerate-alisia-farsightedly.ngrok-free.dev/webhook/soc-alert"
  # URL webhook riêng cho từng loại sự kiện — khớp với n8n webhook paths
  n8n_webhook_url_ddos:     "https://undegenerate-alisia-farsightedly.ngrok-free.dev/webhook/ddos-alert"
  n8n_webhook_url_phishing: "https://undegenerate-alisia-farsightedly.ngrok-free.dev/webhook/phishing-alert"
  n8n_webhook_url_wazuh:    "https://undegenerate-alisia-farsightedly.ngrok-free.dev/webhook/wazuh-critical-alert"
  # Timeout khi gọi webhook (giây)
  webhook_timeout_seconds: 10
  # Số lần retry khi gọi webhook thất bại
  max_retries: 3
  # Bật/tắt tích hợp SOAR
  enabled: true
  # Shared secret để xác thực callback từ n8n về Server.
  # n8n phải thêm header: X-SOC-Callback-Secret: <giá trị này> trong node HTTP Request.
  # Để trống ("") sẽ BỎ QUA xác thực (không khuyến khích khi deploy thật).
  callback_secret: "your-strong-random-secret-here"

# ==============================================================================
# Cấu hình Agent Heartbeat Monitor
# ==============================================================================
heartbeat:
  # Khoảng thời gian kiểm tra Agent offline (giây)
  check_interval_seconds: 30
  # Thời gian không nhận heartbeat thì đánh dấu Agent offline (giây)
  offline_threshold_seconds: 90
